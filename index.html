<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3e8" />
    <script>
      // Apply the saved theme before first paint (same key as dncnl.dev).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('dncnl-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta
      name="description"
      content="Daniel Martin Canlapan — computer science student who builds software, from problem to shipped screen."
    />
    <title>Handoff — dncnl.dev</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
  </head>
